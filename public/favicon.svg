<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="100" height="100" rx="20" fill="#09090b" />
  <circle cx="50" cy="50" r="35" fill="#06b6d4" opacity="0.15" />
  <g filter="drop-shadow(0px 0px 6px #22d3ee)">
    <!-- Deep background shadow facets -->
    <path d="M 50,12 L 78,32 L 50,88 L 22,32 Z" fill="url(#ore-deep-glow)" opacity="0.4" />
    
    <!-- Main Crystalline Facets -->
    <path d="M 50,12 L 22,32 L 44,54 L 50,12" fill="url(#ore-cyan-dark)" stroke="#06b6d4" stroke-width="1.5" stroke-linejoin="round" />
    <path d="M 50,12 L 50,54 L 78,32 L 50,12" fill="url(#ore-cyan-medium)" stroke="#22d3ee" stroke-width="1.5" stroke-linejoin="round" />
    <path d="M 22,32 L 50,88 L 44,54 L 22,32" fill="url(#ore-silver-dark)" stroke="#0891b2" stroke-width="1.5" stroke-linejoin="round" />
    <path d="M 78,32 L 50,54 L 50,88 L 78,32" fill="url(#ore-cyan-light)" stroke="#67e8f9" stroke-width="1.5" stroke-linejoin="round" />
    <path d="M 50,28 L 44,54 L 50,88 L 50,28" fill="url(#ore-core-glow)" stroke="#e0f7fa" stroke-width="1" opacity="0.95" />

    <!-- Sparkles -->
    <circle cx="34" cy="22" r="2" fill="#ffffff" />
    <circle cx="70" cy="46" r="1.5" fill="#22d3ee" />
    <circle cx="50" cy="9" r="1" fill="#ffffff" />
  </g>

  <defs>
    <linearGradient id="ore-deep-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0891b2" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="ore-cyan-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0e7490" />
    </linearGradient>
    <linearGradient id="ore-cyan-medium" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#083344" />
      <stop offset="100%" stop-color="#164e63" />
    </linearGradient>
    <linearGradient id="ore-silver-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0891b2" />
    </linearGradient>
    <linearGradient id="ore-cyan-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#0891b2" />
    </linearGradient>
    <linearGradient id="ore-core-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#cffafe" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>
</svg>
